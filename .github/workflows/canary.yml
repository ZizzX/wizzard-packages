# Every merge to main that carries a changeset is published under the
# `canary` dist-tag, except while a pre-release is active. This is what
# replaces a long-lived `dev` branch: an unfinished feature is tried with
# `pnpm add @wizzard-packages/core@canary`, not by checking out a branch.
name: Canary

on:
  # Publishing is only testable by publishing. Without this the only way to
  # retry a token or a registry hiccup is to re-run an old push.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.changeset/**'

concurrency:
  group: canary
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    environment: wizzard-packages
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # No pending changesets means nothing changed that is worth a canary.
      # In pre mode `changeset version --snapshot` refuses to run, and a merge
      # reaches npm with the next `next` release instead.
      - name: Check for changesets
        id: check
        run: |
          mode=$(node -p "require('./.changeset/pre.json').mode" 2>/dev/null || true)
          if [ "$mode" = "pre" ]; then
            echo "::notice::Pre mode is active, so no canary is published until 'changeset pre exit'."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=$(find .changeset -name '*.md' ! -name 'README.md' | wc -l)
          if [ "$count" -gt 0 ]; then publish=true; else publish=false; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.publish == 'true'
        run: pnpm build

      - name: Publish canary
        if: steps.check.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          pnpm changeset version --snapshot canary
          pnpm changeset publish --tag canary --no-git-tag

      # changeset publish reports success for packages the registry never
      # saved, and exits 0. Ask the registry what actually landed.
      - name: Verify the registry has them
        if: steps.check.outputs.publish == 'true'
        run: node scripts/verify-published.mjs
