name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, formatting and the generated snippets need nothing built, so they run
  # on their own runner rather than lengthening build-test.
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # The README's code blocks are generated from files vitest runs. This
      # fails when they drift, so the example a reader pastes is the example CI
      # proved.
      - name: Examples match the docs
        run: pnpm examples:check

  # The packaging gates read the built artifacts and do not vary by Node
  # version, so they pay for their own build once instead of sitting at the end
  # of the Node 22 leg.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package lint
        run: pnpm publint

      - name: Types resolution
        run: pnpm attw

      - name: Bundle size
        run: pnpm size

  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    # The published packages promise Node >=20.11, so the Node 20 leg proves
    # that promise. The docs site is private and its toolchain (Astro) requires
    # Node >=22.12, so it sits out that leg.
    env:
      WORKSPACE_FILTER: ${{ matrix.node == 20 && '--filter=!@wizzard-packages/site' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check $WORKSPACE_FILTER

      - name: Build
        run: pnpm build $WORKSPACE_FILTER

      - name: Unit tests
        run: pnpm test:coverage

  # Runs beside build-test rather than after it, and split across shards: the
  # suite alone took longer than the rest of CI. Every shard starts all four
  # web servers, so every shard builds everything.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e --shard ${{ matrix.shard }}/4
        timeout-minutes: 25

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
